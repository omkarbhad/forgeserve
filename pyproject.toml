[project]
name = "forgeserve"
version = "0.1.0"
description = "A small LLM inference engine from scratch in PyTorch: tensor parallelism, pipeline parallelism, paged KV cache with continuous batching, speculative decoding."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forgeserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
